[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsage"
version = "0.2.0"
description = "FinSage - Intelligent Knowledge Extraction and Retrieval Framework"
requires-python = ">=3.10"
dependencies = [
    "arxiv",
    "pyyaml",
    "openai>=1.68.2",
    "openai-agents>=0.14",
    "pillow>=10.1.0,<11.0.0",
    "ipykernel>=6.29.5",
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "python-dotenv>=1.0.0",
    "httpx[socks]>=0.28.1",
    "litellm>=1.74.0.post1",
    "liteparse>=2.6,<3",
    "llama-index-core>=0.14,<0.15",
    "llama-index-retrievers-bm25>=0.6,<0.7",
    "jinja2>=3.0.0",
    "trafilatura>=1.10",
    # ── FinSage extension dependencies ──────────────────────────────────
    "spacy>=3.7.0",
    "chromadb>=0.5.0",
    "networkx>=3.3",
    "python-dateutil>=2.9.0",
    "scipy>=1.13",
    "bert-score>=0.3.13",
    "pandas>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Dev tooling that backs scripts/verify.sh: ruff (format+lint), basedpyright
# (type check), import-linter (architecture contracts), pytest+pytest-cov
# (tests + coverage floor). Black/isort/mypy from the previous toolchain are
# intentionally dropped — ruff and basedpyright supersede them.
dev = [
    "ruff>=0.11,<0.12",
    "basedpyright>=1.39",
    "import-linter>=2.11",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pre-commit>=3.0",
]
full = [
    "marker-pdf>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=2.2.0",
    "spacy-transformers>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["finsage*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# ----------------------------------------------------------------------------
# ruff: format + lint
# ----------------------------------------------------------------------------

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
# Layered rule selection. D (docstrings) keeps the existing convention;
# F (pyflakes) catches real bugs; I (isort) keeps imports tidy; E/W
# (pycodestyle, minus E501 which ruff format already handles); B (bugbear)
# catches subtle correctness issues.
select = ["D", "E", "F", "I", "W", "B", "W505"]
ignore = [
    # Docstring rules we explicitly waive (see existing convention).
    "D100", "D102", "D104", "D105", "D107", "D203", "D213", "D401", "D402",
    # E501 (line-too-long) is handled by ruff format; flagging it again on
    # long URLs / strings only adds noise.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests don't need module/function docstrings or strict bugbear rules.
"tests/**/*.py" = ["D", "B"]
"**/__init__.py" = ["D104", "F401"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

# ----------------------------------------------------------------------------
# basedpyright: type checker
# ----------------------------------------------------------------------------
# Every module in `finsage/` is type-checked at "standard" mode. PR5
# deleted the transitional packages (`config/`, `flow/`, `llm/`,
# `models/`) so the exclude list is now down to the directories pyright
# always wants ignored.

[tool.basedpyright]
include = ["finsage"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/build",
]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
# Pydantic v2 discriminated unions tighten a `str` field to `Literal["..."]`
# in subclasses (e.g. `Paper.item_type: Literal["paper"]`). Python's variance
# rules say mutable attributes must be invariant, so basedpyright flags this
# even though Pydantic supports it. We use this idiom throughout knowledge/
# and configs/, so disable the diagnostic globally.
reportIncompatibleVariableOverride = "none"

# ----------------------------------------------------------------------------
# import-linter: architectural boundary contracts
# ----------------------------------------------------------------------------
# Encodes the target architecture: etl is an independent stdlib-only leaf;
# utils, knowledge, and preprocess are leaves; configs and library depend only
# on knowledge; rag depends only on preprocess; flows + magic is the apex
# layer. The transitional packages (config/, flow/, llm/, models/) remain
# forbidden as a tripwire.

[tool.importlinter]
root_packages = ["finsage"]

[[tool.importlinter.contracts]]
name = "etl is independent (stdlib only)"
type = "forbidden"
source_modules = ["finsage.etl"]
forbidden_modules = [
    "finsage.configs",
    "finsage.flows",
    "finsage.knowledge",
    "finsage.library",
    "finsage.magic",
    "finsage.mind",
    "finsage.preprocess",
    "finsage.rag",
    "finsage.utils",
]

[[tool.importlinter.contracts]]
name = "utils is a leaf (no inbound deps from finsage packages)"
type = "forbidden"
source_modules = ["finsage.utils"]
forbidden_modules = [
    "finsage.configs",
    "finsage.etl",
    "finsage.flows",
    "finsage.knowledge",
    "finsage.library",
    "finsage.magic",
    "finsage.mind",
    "finsage.preprocess",
    "finsage.rag",
]

[[tool.importlinter.contracts]]
name = "knowledge is a leaf (no inbound deps from finsage packages)"
type = "forbidden"
source_modules = ["finsage.knowledge"]
forbidden_modules = [
    "finsage.configs",
    "finsage.etl",
    "finsage.flows",
    "finsage.library",
    "finsage.magic",
    "finsage.mind",
    "finsage.preprocess",
    "finsage.rag",
    "finsage.utils",
]

[[tool.importlinter.contracts]]
name = "configs only depends on knowledge"
type = "forbidden"
source_modules = ["finsage.configs"]
forbidden_modules = [
    "finsage.etl",
    "finsage.flows",
    "finsage.library",
    "finsage.magic",
    "finsage.mind",
    "finsage.preprocess",
    "finsage.rag",
]

[[tool.importlinter.contracts]]
name = "preprocess only depends on utils (no inbound deps on configs/knowledge/flows)"
type = "forbidden"
source_modules = ["finsage.preprocess"]
forbidden_modules = [
    "finsage.configs",
    "finsage.etl",
    "finsage.flows",
    "finsage.knowledge",
    "finsage.library",
    "finsage.magic",
    "finsage.mind",
    "finsage.rag",
]

[[tool.importlinter.contracts]]
name = "library only depends on knowledge"
type = "forbidden"
source_modules = ["finsage.library"]
forbidden_modules = [
    "finsage.config",
    "finsage.configs",
    "finsage.etl",
    "finsage.flow",
    "finsage.flows",
    "finsage.llm",
    "finsage.magic",
    "finsage.mind",
    "finsage.models",
    "finsage.preprocess",
    "finsage.rag",
    "finsage.utils",
]

[[tool.importlinter.contracts]]
name = "rag only depends on preprocess"
type = "forbidden"
source_modules = ["finsage.rag"]
forbidden_modules = [
    "finsage.config",
    "finsage.configs",
    "finsage.etl",
    "finsage.flow",
    "finsage.flows",
    "finsage.knowledge",
    "finsage.library",
    "finsage.llm",
    "finsage.magic",
    "finsage.mind",
    "finsage.models",
    "finsage.utils",
]

[[tool.importlinter.contracts]]
name = "mind only depends on configs, knowledge, library, and utils"
type = "forbidden"
source_modules = ["finsage.mind"]
forbidden_modules = [
    "finsage.config",
    "finsage.etl",
    "finsage.flow",
    "finsage.flows",
    "finsage.llm",
    "finsage.magic",
    "finsage.models",
    "finsage.preprocess",
    "finsage.rag",
]

[[tool.importlinter.contracts]]
name = "flows + magic is apex (no transitional package imports)"
type = "forbidden"
source_modules = [
    "finsage.flows",
    "finsage.magic",
]
# These packages were deleted in PR5; the contract guards against any
# future code re-introducing them under the same names.
forbidden_modules = [
    "finsage.config",
    "finsage.etl",
    "finsage.flow",
    "finsage.llm",
    "finsage.models",
]

[[tool.importlinter.contracts]]
# Module will be created in Phase 7
name = "evaluation is apex (same as flows — can import from all finsage modules)"
type = "forbidden"
source_modules = ["finsage.evaluation"]
forbidden_modules = [
    "finsage.config",
    "finsage.flow",
    "finsage.llm",
    "finsage.models",
]

# ----------------------------------------------------------------------------
# pytest: configuration + coverage gate
# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage floor 75% — PR5 deleted the transitional packages so every
# remaining module is in the target architecture and is well-tested.
addopts = [
    "--cov=finsage",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
    "-ra",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["finsage"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# Branch coverage. Floor moves with the migration:
#   PR3: 60% (parsers/sources still drag the average down)
#   PR4: 65% (parsers/sources gone; preprocess >85%)
#   PR5: 75% (flow/, llm/, config/, transitional models/ gone)
